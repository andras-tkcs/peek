[tools]
go = "1.26.10"

[tasks.fmt]
description = "Format all Go source files"
run = """
files=$(git ls-files '*.go' | while IFS= read -r file; do [ -f "$file" ] && printf '%s\n' "$file"; done)
test -z "$files" || gofmt -w $files
"""

[tasks.fmt-check]
description = "Verify Go source formatting"
run = """
files=$(git ls-files '*.go' | while IFS= read -r file; do [ -f "$file" ] && printf '%s\n' "$file"; done)
unformatted=$(test -z "$files" || gofmt -l $files)
test -z "$unformatted" || (printf '%s\n' "$unformatted" && exit 1)
"""

[tasks.tailwind]
description = "Generate optimized Tailwind CSS from templates"
run = """
set -eu
TW_VERSION=v4.3.1
case "$(uname -s)" in
  Linux) OS=linux ;;
  Darwin) OS=macos ;;
  *) echo "tailwind: unsupported OS $(uname -s)" >&2; exit 1 ;;
esac
case "$(uname -m)" in
  x86_64|amd64) ARCH=x64 ;;
  arm64|aarch64) ARCH=arm64 ;;
  *) echo "tailwind: unsupported architecture $(uname -m)" >&2; exit 1 ;;
esac
# SHA-256 from https://github.com/tailwindlabs/tailwindcss/releases/download/v4.3.1/sha256sums.txt
case "$OS-$ARCH" in
  linux-x64)   TW_SHA256=2526d063ba03b71f9a3ea7d5cee14f0aec147f117f222d5adc97b1d736d45999 ;;
  linux-arm64) TW_SHA256=3d662377a86d71c43b549dc06b90db4586b4acd412bf827a3268e951661e5adf ;;
  macos-x64)   TW_SHA256=e9e830ceb3e70b7e0775a3dd79eee8ec82c6b31270f08f2fa2857d0077045ac3 ;;
  macos-arm64) TW_SHA256=a27c43626185953ee19bdace1939c7601e55da654e0b2fc4461e3e29957aa739 ;;
esac
sha256_of() {
  if command -v sha256sum >/dev/null 2>&1; then sha256sum "$1" | awk '{print $1}'
  else shasum -a 256 "$1" | awk '{print $1}'; fi
}
TW=bin/tailwindcss
if [ ! -x "$TW" ] || [ "$(sha256_of "$TW")" != "$TW_SHA256" ]; then
  echo "Downloading Tailwind CSS standalone CLI ${TW_VERSION}..."
  mkdir -p bin
  curl -fsSL -o "$TW.tmp" "https://github.com/tailwindlabs/tailwindcss/releases/download/${TW_VERSION}/tailwindcss-${OS}-${ARCH}"
  GOT=$(sha256_of "$TW.tmp")
  if [ "$GOT" != "$TW_SHA256" ]; then
    rm -f "$TW.tmp"
    echo "tailwind: checksum mismatch (expected $TW_SHA256, got $GOT)" >&2
    exit 1
  fi
  chmod +x "$TW.tmp"
  mv "$TW.tmp" "$TW"
fi
"$TW" -i internal/web/tailwind-input.css -o internal/web/assets/pines.css --minify
"""

[tasks.build]
description = "Build both binaries (Peek server + CLI) into bin/"
run = "go build -o bin/peekd ./cmd/peekd && go build -o bin/peek ./cmd/peek"
depends = ["tailwind"]

[tasks.vet]
description = "Run go vet on all packages"
run = "go vet ./..."

[tasks.test]
description = "Run the unit test suite"
run = "go test ./..."

[tasks.race]
description = "Run the unit test suite with the race detector"
run = "go test -race -count=1 ./..."

[tasks.e2e]
description = "Run the end-to-end test of the built peek and peekd binaries"
run = "PEEK_E2E=1 go test -count=1 -run '^TestE2E' ./internal/e2e"

[tasks.coverage]
description = "Run tests with coverage and fail below the 95% total or 93% per-core-package gates"
run = "sh scripts/coverage-gate.sh"

[tasks.govulncheck]
description = "Run the Go vulnerability scanner"
run = "go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./..."

[tasks.staticcheck]
description = "Run Staticcheck on all packages"
# v0.8.1 == staticcheck 2026.2.1
run = "go run honnef.co/go/tools/cmd/staticcheck@v0.8.1 ./..."

[tasks.check]
description = "Run the local quality gate used before commits"
depends = ["fmt-check", "vet", "test", "build"]

[tasks.check-full]
description = "Run the full CI-equivalent local quality gate"
depends = ["check", "race", "coverage", "govulncheck", "staticcheck"]

[tasks.run]
description = "Start the dev server on :7700 with a fresh data dir"
run = "rm -rf data && ./bin/peekd --addr :7700 --data ./data --base-url http://localhost:7700"
depends = ["build"]

[tasks.setup-cli]
description = "Configure the CLI to point at the local dev server"
run = "./bin/peek login --host http://localhost:7700"
depends = ["build"]

[tasks.smoke]
description = "Run a local upload/list/stats smoke test against the configured dev server"
depends = ["build"]
run = """
printf '<html><body><h1>Smoke test</h1><p id=t>Hello</p></body></html>' > /tmp/test.html
SLUG=$(./bin/peek upload /tmp/test.html --visibility public | grep '^slug:' | awk '{print $2}')
echo "Uploaded slug: $SLUG"
./bin/peek list
./bin/peek stats "$SLUG"
echo "Smoke test passed."
"""

[tasks.clean]
description = "Remove build artifacts and data dir"
run = "rm -rf bin data"
